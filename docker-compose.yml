services:
  postgres:
    image: postgres:15-alpine
    container_name: gog-postgres
    environment:
      POSTGRES_USER: gog
      POSTGRES_PASSWORD: gog
      POSTGRES_DB: gog_test
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gog -d gog_test"]
      interval: 2s
      timeout: 5s
      retries: 5
